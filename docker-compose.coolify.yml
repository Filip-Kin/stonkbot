# Coolify deployment variant (build + run on the NAS via Coolify).
# The original docker-compose.yml is kept as-is for plain-docker rollback.
# Differences: named volume `stonkbot-data` (keeps the live SQLite WAL out of the
# synced ncdata tree), no fixed container_name/subnet (Coolify manages those).
# Secrets come from Coolify-managed env (written to .env in the build context).
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # Live bot pushes stay silenced (mirrors the original compose); the experiment
    # container keeps its own values.
    environment:
      - NTFY_TOPIC=
      - HA_TOKEN=
    volumes:
      - stonkbot-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard:
    build: .
    restart: unless-stopped
    command: ["bun", "run", "src/dashboard.ts"]
    env_file: .env
    volumes:
      - stonkbot-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Loopback publish so the existing nginx (stonkbot.filipkin.com -> 127.0.0.1:8771)
    # needs no change after cutover.
    ports:
      - "127.0.0.1:8771:8771"

  experiment:
    build: .
    restart: unless-stopped
    command: ["bun", "run", "src/experiment/main.ts"]
    env_file: .env
    volumes:
      - stonkbot-data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  stonkbot-data:
