# Coolify deployment variant (build + run on the NAS via Coolify).
# The original docker-compose.yml is kept as-is for plain-docker rollback.
# Differences: bind mount `/data/stonkbot` (live SQLite WAL lives outside the
# synced ncdata tree, on a stable host path), no fixed container_name/subnet
# (Coolify manages those). Secrets come from Coolify-managed env (.env).
services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    # Live bot pushes stay silenced (mirrors the original compose); the experiment
    # container keeps its own values.
    environment:
      - NTFY_TOPIC=
      - HA_TOKEN=
    volumes:
      - /data/stonkbot:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

  dashboard:
    build: .
    restart: unless-stopped
    command: ["bun", "run", "src/dashboard.ts"]
    env_file: .env
    volumes:
      - /data/stonkbot:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Loopback publish so the existing nginx (stonkbot.filipkin.com -> 127.0.0.1:8771)
    # needs no change after cutover.
    ports:
      - "127.0.0.1:8771:8771"

# The `experiment` service is deliberately gone. The 40-arm Arena ended 2026-09-11
# (0/40 beat SCHD or the Control on a 95% bootstrap band; in-sample rank told you
# nothing about out-of-sample). Its record is frozen in the arm_* tables and still
# renders at /experiment, and the full analysis lives in Nextcloud Arena_Analysis/.
#
# It was stopped with `docker stop` four times and came back every deploy, because
# Coolify recreates the whole compose. Removing the service is the only thing that
# actually keeps it down. To run another experiment, restore this block from git:
#
#   experiment:
#     build: .
#     restart: unless-stopped
#     command: ["bun", "run", "src/experiment/main.ts"]
#     env_file: .env
#     volumes:
#       - /data/stonkbot:/app/data
#     extra_hosts:
#       - "host.docker.internal:host-gateway"
